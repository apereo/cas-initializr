initializr:
  boot-versions:
    - id: ${springBootLatestVersion}
      default: true
  env:
    boms:
      cas-bom:
        groupId: org.apereo.cas
        artifactId: cas-server-support-bom
        version: ${casLatestVersion}
cas-initializr:
  supported-versions:
    - version: 7.3.8.1
      platform-version: 7.3.0
      boot-version: 3.5.6
      sync: true
      validate: true
      branch: "7.3"
      type: cas
      tomcat-version: ${apacheTomcat11LatestVersion}
      java-version: 21
      graalvm-version: "latest-ea"
      container-base-image: azul/zulu-openjdk:21
      gradle-version: "9.1.0"
      app-servers:
        - tomcat
        - jetty
      plugins:
        jib-version: ${jibVersion}
        open-rewrite-version: ${openRewriteVersion}
    - version: 8.0.1.1
      platform-version: 8.0.0
      boot-version: 4.1.0
      sync: true
      validate: true
      branch: "8.0"
      type: cas
      tomcat-version: ${apacheTomcat11LatestVersion}
      java-version: 25
      graalvm-version: "latest-ea"
      container-base-image: azul/zulu-openjdk:25
      gradle-version: "9.6.1"
      app-servers:
        - tomcat
        - jetty
      plugins:
        jib-version: ${jibVersion}
        open-rewrite-version: ${openRewriteVersion}
    - version: ${casLatestVersion}
      platform-version: ${casLatestVersion}
      boot-version: ${springBootLatestVersion}
      sync: true
      validate: true
      branch: master
      type: cas
      tomcat-version: ${apacheTomcat11LatestVersion}
      java-version: 25
      graalvm-version: "latest-ea"
      container-base-image: azul/zulu-openjdk:25
      gradle-version: "${gradleLatestVersion}"
      app-servers:
        - tomcat
        - jetty
      plugins:
        jib-version: ${jibVersion}
        open-rewrite-version: ${openRewriteVersion}
